name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Identify runner image for pip cache
      id: image
      run: |
        printf 'identity=%s-%s\n' "${ImageOS:?ImageOS is required}" "${ImageVersion:?ImageVersion is required}" >> "$GITHUB_OUTPUT"

    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.identity }}-py${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.identity }}-py${{ matrix.python-version }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run linting
      run: |
        pip install ruff
        ruff check . || true  # Non-blocking for now

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  integration-test:
    runs-on: ubuntu-24.04
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Test installer script
      run: |
        # Test the installer works
        bash install.sh /tmp/test-install minimal --dry-run

    - name: Test patterns
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python scripts/validate_patterns.py || true  # Non-blocking if script doesn't exist yet

    - name: Documentation check
      run: |
        python scripts/housekeeping_protocol.py documentation-check || true

  security:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Run security checks
      run: |
        # Check for secrets
        if grep -r "api_key\|secret\|password\|token" . --include="*.py" --exclude-dir=tests --exclude-dir=.git; then
          echo "Warning: Potential secrets found"
        fi

        # Check for common security issues
        python -m pip install bandit
        bandit -r . -ll || true  # Non-blocking